<body>
<title>La Cena del Mercoledì</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Caveat:wght@600&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: app a una colonna con barra in basso; il momento forte è il piatto sulla tovaglia a quadri */
:root{
  --bg:#FDF2EC; --card:#FFFFFF; --ink:#3A1A1F; --muted:#8C6B6F; --line:#F0DDD5; --rim:#F3E3DE;
  --red:#E5412F; --red-deep:#B92E20; --red-soft:#FCE3DD; --gold:#FFB21E; --gold-deep:#E99C00; --gold-soft:#FFF1CF;
  --n1:#FFF4B8; --n2:#DDF4E5; --n3:#E2ECFF; --n4:#FFE0E6; --white:#FFFFFF;
  --f-display:"Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-hand:"Caveat", "Bradley Hand", "Segoe Print", cursive;
  color-scheme: light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit}

.app{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:18px calc(108px + env(safe-area-inset-bottom, 0px))}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand small{display:block;font:800 .72rem var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--red)}
.brand h1{margin:2px 0 0;font:400 1.75rem/1.02 var(--f-display);letter-spacing:.005em;text-wrap:balance}
.icon-btn{width:48px;height:48px;flex:none;border-radius:50%;border:none;background:var(--card);box-shadow:0 1px 0 var(--line),0 8px 18px -12px rgba(58,26,31,.45);display:grid;place-items:center;color:var(--ink);cursor:pointer}
.icon-btn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

main{display:flex;flex-direction:column}
.view{display:flex;flex-direction:column;gap:16px}
.demo{background:var(--n3);border-radius:16px;padding:10px 14px;font-size:.86rem;font-weight:600;line-height:1.4}

/* hero */
.hero{display:flex;flex-direction:column;gap:12px}
.kicker{margin:0;font:800 .76rem var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tovaglia{border-radius:30px;padding:30px 10px;display:flex;align-items:center;justify-content:center;gap:clamp(6px,3vw,18px);overflow:hidden;
  background-color:var(--white);
  background-image:linear-gradient(90deg, rgba(229,65,47,.40) 50%, transparent 0),linear-gradient(rgba(229,65,47,.40) 50%, transparent 0);
  background-size:34px 34px;box-shadow:inset 0 0 0 1px rgba(185,46,32,.12),0 18px 34px -26px rgba(185,46,32,.7)}
.cutlery{width:22px;height:clamp(108px,38vw,150px);flex:none;color:var(--white);filter:drop-shadow(0 2px 2px rgba(58,26,31,.25))}
.plate{position:relative;width:min(250px,62vw);aspect-ratio:1;max-width:100%;flex:none;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, var(--white) 0 56%, var(--rim) 56.6% 58.4%, var(--white) 59% 100%);
  box-shadow:0 22px 34px -18px rgba(58,26,31,.55),0 0 0 1px rgba(58,26,31,.06),inset 0 -8px 16px rgba(58,26,31,.05);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18%;gap:4px;animation:land .6s cubic-bezier(.2,.9,.3,1.2)}
@keyframes land{from{transform:translateY(-10px) scale(.96)}to{transform:none}}
.dish{font:400 1.45rem/1.06 var(--f-display);text-wrap:balance;overflow-wrap:anywhere}
.dish.long{font-size:1.15rem}
.dish.xlong{font-size:.95rem}
.q{font:400 3.2rem/1 var(--f-display);color:var(--red)}
.by{font-size:.84rem;color:var(--muted);line-height:1.25}
.by b{color:var(--ink);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:7px 14px;font-weight:800;font-size:.88rem;box-shadow:0 1px 0 var(--line)}
.chip.hot{background:var(--red);color:var(--white)}
.quote{margin:0;font:600 1.35rem/1.2 var(--f-hand);color:var(--red-deep)}

/* avatar */
.avatar{width:46px;height:46px;border-radius:50%;background:var(--red-soft);display:grid;place-items:center;font-size:1.5rem;line-height:1;flex:none}
.avatar.lg{width:62px;height:62px;font-size:2rem}
.plate .avatar{width:40px;height:40px;font-size:1.3rem;background:var(--red-soft)}

/* sezioni e card */
.section{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.section-title,.page-title{margin:0;font:400 1.4rem/1.15 var(--f-display);text-wrap:balance}
.page-title{font-size:1.65rem}
.card{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 1px 0 var(--line),0 16px 30px -26px rgba(58,26,31,.5);display:flex;flex-direction:column;gap:14px;min-width:0}
.card-title{margin:0;font:400 1.1rem var(--f-display)}
.card.empty{align-items:center;text-align:center;padding:30px 22px}
.card.empty svg{width:60px;height:60px;color:var(--red);fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.card.empty p{margin:0;color:var(--muted);max-width:32ch}
.hint{font-size:.9rem;color:var(--muted);margin:0}
.dishline{display:flex;align-items:center;gap:12px;min-width:0}
.dishline > div{min-width:0}
.dishline strong{display:block;font:400 1.2rem/1.15 var(--f-display);overflow-wrap:anywhere}

/* voto */
.vote{display:flex;flex-direction:column;gap:14px}
.stars{display:flex;justify-content:space-between;gap:6px;max-width:360px}
.star{flex:1;aspect-ratio:1;max-width:62px;border:none;background:none;padding:2px;cursor:pointer;border-radius:16px}
.star svg{width:100%;height:100%;display:block;overflow:visible}
.star path{fill:var(--rim);stroke:#EACCC3;stroke-width:1.1;stroke-linejoin:round;transition:fill .18s}
.star.on path{fill:var(--gold);stroke:var(--gold-deep)}
.star.pop svg{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.28) rotate(-8deg)}100%{transform:scale(1)}}
.star-word{font:600 1.6rem/1 var(--f-hand);color:var(--red-deep);min-height:1.1em}
.field{display:flex;flex-direction:column;gap:8px;font-weight:800;font-size:.92rem;min-width:0}
input[type=text],input[type=time],textarea{width:100%;font:600 1rem var(--f-body);color:var(--ink);background:var(--bg);border:2px solid transparent;border-radius:16px;padding:13px 14px;outline:none;transition:border-color .15s}
input::placeholder,textarea::placeholder{color:#B79C9F;font-weight:400}
input:focus,textarea:focus{border-color:var(--red)}
textarea{min-height:96px;resize:vertical;display:block}
.lock{display:flex;gap:8px;align-items:center;font-size:.84rem;color:var(--muted);font-weight:600}
.lock svg{flex:none}
.err{color:var(--red-deep);font-weight:800;font-size:.9rem}
.err:empty{display:none}
.teaser{background:var(--gold-soft);border-radius:16px;padding:12px 14px;font-weight:700;font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn.block{flex:1 1 180px}

.btn{appearance:none;border:none;border-radius:999px;padding:13px 22px;font:800 1rem var(--f-body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;text-decoration:none;transition:transform .1s}
.btn:active{transform:translateY(1px) scale(.99)}
.btn.red{background:var(--red);color:var(--white);box-shadow:0 10px 20px -12px var(--red)}
.btn.soft{background:var(--red-soft);color:var(--red-deep)}
.btn.ghost{background:var(--bg);color:var(--ink)}
.btn.wa{background:#1FA855;color:var(--white)}
.btn.block{width:100%}
.btn[disabled]{opacity:.6}
.link{background:none;border:none;color:var(--red-deep);font:800 .9rem var(--f-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 0}
.link.danger{color:var(--white);background:var(--red);text-decoration:none;border-radius:999px;padding:6px 12px}
.btn:focus-visible,.icon-btn:focus-visible,.star:focus-visible,.tab:focus-visible,.member:focus-visible,.link:focus-visible,.hrow:focus-visible,.emo:focus-visible,.seg button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* risultati */
.mine{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--bg);border-radius:16px;padding:8px 14px;font-weight:800;font-size:.9rem}
.mine > span{display:inline-flex;align-items:center;gap:8px}
.results{display:flex;flex-direction:column;gap:16px}
.verdict{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.score{font:400 3.4rem/1 var(--f-display);color:var(--red);font-variant-numeric:tabular-nums}
.score.sm{font-size:2.2rem}
.mini-stars{display:inline-flex;gap:2px;vertical-align:middle}
.mini-stars svg{width:17px;height:17px;display:block}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:2.4rem 1fr 1.4rem;align-items:center;gap:8px;font-weight:800;font-size:.84rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar .track{height:10px;border-radius:99px;background:var(--bg);overflow:hidden;display:block}

/* classifica */

.step .avatar{background:var(--card);box-shadow:0 0 0 3px var(--card),0 6px 14px -8px rgba(58,26,31,.5)}

.p1 .pblock{height:112px;background:linear-gradient(var(--gold),var(--gold-deep))}

.rlist{display:flex;flex-direction:column}

.rrow:last-child{border-bottom:none}
.pos{font:400 1.1rem var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums}
.rname{font-weight:800;min-width:0;overflow-wrap:anywhere;line-height:1.25}
.rname small{display:block;font-weight:600;color:var(--muted);font-size:.8rem}
.rval{font:400 1.1rem var(--f-display);white-space:nowrap}
.best-dish{font:400 1.6rem/1.08 var(--f-display);text-wrap:balance;overflow-wrap:anywhere}
.card.best{background:linear-gradient(160deg,var(--gold-soft),var(--card) 70%)}

/* storico */
.hist{display:flex;flex-direction:column;gap:12px}
.hitem{background:var(--card);border-radius:22px;box-shadow:0 1px 0 var(--line),0 14px 26px -24px rgba(58,26,31,.5);overflow:hidden}
.hrow{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:12px 14px 12px 12px;border:none;background:none;width:100%;text-align:left;cursor:pointer}
.date{background:var(--red-soft);border-radius:14px;text-align:center;padding:7px 0 5px;color:var(--red-deep)}
.date b{display:block;font:400 1.45rem/1 var(--f-display)}
.date span{font-weight:800;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em}
.hmain{min-width:0;display:flex;flex-direction:column}
.hmain strong{font:400 1.1rem/1.15 var(--f-display);overflow-wrap:anywhere}
.hval{display:flex;align-items:baseline;gap:3px;white-space:nowrap}
.hval b{font:400 1.3rem var(--f-display);color:var(--red)}
.hval small{font-weight:800;color:var(--muted);font-size:.8rem}
.hval .gold{color:var(--gold-deep);font-size:1rem}

/* barra in basso */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px max(12px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 -1px 0 var(--line)}

.tab svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--red);background:var(--red-soft)}

/* foglio famiglia */
.scrim{position:fixed;inset:0;background:rgba(58,26,31,.4);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90%;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:28px 28px 0 0;padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:14px;animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-head h2{margin:0;font:400 1.6rem var(--f-display)}
.mlist{display:flex;flex-direction:column}
.mrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:none}
.mname{flex:1;font-weight:800;min-width:0;overflow-wrap:anywhere}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emo{width:44px;height:44px;border-radius:50%;border:2px solid transparent;background:var(--bg);font-size:1.4rem;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.emo[aria-checked="true"]{border-color:var(--red);background:var(--red-soft)}
.addm{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.addrow{display:flex;gap:8px;align-items:stretch}
.addrow input{flex:1;min-width:0}
.center{text-align:center}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--white);padding:12px 20px;border-radius:999px;font-weight:800;font-size:.92rem;z-index:40;box-shadow:0 14px 30px -14px rgba(58,26,31,.8);max-width:calc(100% - 32px);text-align:center}
.toast.show{animation:toast .3s ease}
@keyframes toast{from{transform:translate(-50%,12px);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.loader{display:flex;flex-direction:column;align-items:center;gap:14px;padding:60px 0;color:var(--muted);font-weight:700}
.loader .mini{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle, var(--white) 0 55%, var(--rim) 56% 59%, var(--white) 60%);box-shadow:0 10px 20px -12px rgba(58,26,31,.5);animation:spin 1.6s ease-in-out infinite}
@keyframes spin{50%{transform:scale(.9)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
(function(){
"use strict";

/* I dati condivisi passano dalla funzione Netlify /api. Senza server l'app parte in modalità prova. */
const API = "/api";

const DAYMS = 864e5;
const WORDS = ["", "Da rifare", "Così così", "Buono", "Buonissimo", "Da stella Michelin"];
const EMOJIS = ["👩","👨","👵","👴","🧑","👧","👦","🧔","👱","🐶"];
const NOTE_COLORS = ["var(--n1)","var(--n2)","var(--n3)","var(--n4)"];
const STAR_D = "M12 2.8l2.75 5.86 6.4.78-4.72 4.4 1.22 6.33L12 17.08l-5.65 3.09 1.22-6.33-4.72-4.4 6.4-.78z";
const VIEWS = ["stasera","chef","classifica","storico"];

const SVG = {
  fork:'<svg class="cutlery" viewBox="0 0 24 120" aria-hidden="true"><path d="M5 6v30c0 5 3 8 7 8s7-3 7-8V6M12 6v28M12 44v68" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/></svg>',
  knife:'<svg class="cutlery" viewBox="0 0 24 120" aria-hidden="true"><path d="M15 6c-7 6-9 26-6 44h6z" fill="currentColor"/><path d="M12 50v62" fill="none" stroke="currentColor" stroke-width="3.8" stroke-linecap="round"/></svg>',
  lock:'<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10V8a6 6 0 1 1 12 0v2h1v12H5V10h1Zm2 0h8V8a4 4 0 1 0-8 0v2Z" fill="currentColor"/></svg>',
  close:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  crown:'<svg class="crown" viewBox="0 0 40 26" aria-hidden="true"><path d="M3 22 6 6l9 8 5-11 5 11 9-8 3 16z" style="fill:var(--gold);stroke:var(--gold-deep)" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  hat:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 17.5h9V21h-9zM7.5 17.5V13.2A4 4 0 0 1 8.3 5.4a4.6 4.6 0 0 1 7.4 0 4 4 0 0 1 .8 7.8v4.3"/></svg>',
  trophy:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v6a4 4 0 0 1-8 0V4zM8 6H5a3 3 0 0 0 3 5M16 6h3a3 3 0 0 1-3 5M12 14v4M8 21h8M10 18h4"/></svg>',
  book:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>'
};

/* ---------- utilità ---------- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
const DEV = (function(){ let d = lsGet("cena_dev"); if(!d){ d = Math.random().toString(36).slice(2,10) + Date.now().toString(36); lsSet("cena_dev", d); } return d; })();

function h(tag, props){
  const e = document.createElement(tag);
  if(props) for(const k in props){
    const v = props[k];
    if(v == null || v === false) continue;
    if(k === "class") e.className = v;
    else if(k === "style") e.style.cssText = v;
    else if(k.slice(0,2) === "on") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  const kids = Array.prototype.slice.call(arguments, 2).flat(Infinity);
  for(const c of kids){ if(c == null || c === false) continue; e.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return e;
}
function icon(html){ const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }
function starSvg(on, size){
  const ns = "http://www.w3.org/2000/svg";
  const s = document.createElementNS(ns,"svg"); s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("aria-hidden","true");
  if(size){ s.setAttribute("width", size); s.setAttribute("height", size); }
  const p = document.createElementNS(ns,"path"); p.setAttribute("d", STAR_D);
  if(on !== null){ p.style.fill = on ? "var(--gold)" : "var(--rim)"; }
  s.append(p); return s;
}
function miniStars(n){
  const r = Math.round(n);
  const w = h("span",{class:"mini-stars",role:"img","aria-label":fmtAvg(n)+" stelle su 5"});
  for(let i=1;i<=5;i++) w.append(starSvg(i<=r, 17));
  return w;
}

/* ---------- date ---------- */
const pad = n => String(n).padStart(2,"0");
const idOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromId = id => { const p = id.split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
function at(day, ora){
  const d = typeof day === "string" ? fromId(day) : new Date(day);
  const p = (ora || "20:30").split(":").map(Number); d.setHours(p[0]||0, p[1]||0, 0, 0); return d;
}
function slots(){
  const now = new Date(), ora = Store.data.ora || "20:30";
  const t = new Date(now); t.setHours(0,0,0,0);
  const w = addDays(t, -((t.getDay() - 3 + 7) % 7));
  let vot, up;
  if(now >= at(w, ora)){ vot = w; up = addDays(w, 7); } else { vot = addDays(w, -7); up = w; }
  const today = idOf(t);
  return { vot:idOf(vot), up:idOf(up), upAt:at(up, ora), votToday:idOf(vot)===today, upToday:idOf(up)===today, today };
}
const fmtLong = id => fromId(id).toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
const fmtDM = id => fromId(id).toLocaleDateString("it-IT",{day:"numeric",month:"long"});
const monShort = id => fromId(id).toLocaleDateString("it-IT",{month:"short"}).replace(".","");
function countdown(target){
  const ms = target - new Date(); if(ms <= 0) return "adesso!";
  const t = new Date(); t.setHours(0,0,0,0); const td = new Date(target); td.setHours(0,0,0,0);
  const days = Math.round((td - t) / DAYMS);
  if(days === 0){ const min = Math.round(ms/6e4); if(min < 60) return "tra "+min+" minuti"; const hh = Math.floor(min/60); return "tra "+hh+(hh===1?" ora":" ore"); }
  if(days === 1) return "domani";
  return "tra "+days+" giorni";
}

/* ---------- dati ---------- */
const Store = {
  live:false, ready:false, data:{ membri:[], ora:"20:30", cene:{}, voti:[] }, subs:[],
  emit(){ this.subs.forEach(f => f()); },
  async init(){
    if(/^https?:$/.test(location.protocol) && !/claude/i.test(location.hostname)){
      try{
        const s = await this.fetchState();
        this.live = true; this.setState(s); this.ready = true; this.emit(); this.poll(); return;
      }catch(e){ console.warn("Server non disponibile, modalità prova", e); }
    }
    this.initDemo();
  },
  async fetchState(){
    const r = await fetch(API, { cache:"no-store" });
    if(!r.ok) throw new Error("api " + r.status);
    if((r.headers.get("content-type") || "").indexOf("json") < 0) throw new Error("api non trovata");
    return r.json();
  },
  setState(s){
    const voti = s.voti || {};
    this.data = { membri:s.membri || [], ora:s.ora || "20:30", cene:s.cene || {}, voti:Object.keys(voti).map(k => Object.assign({ id:k }, voti[k])) };
  },
  poll(){
    const tick = async () => {
      if(document.hidden) return;
      try{ const s = await this.fetchState(), before = JSON.stringify(this.data); this.setState(s); if(JSON.stringify(this.data) !== before) this.emit(); }catch(e){}
    };
    setInterval(tick, 15000);
    document.addEventListener("visibilitychange", () => { if(!document.hidden) tick(); });
  },
  async send(op){
    const r = await fetch(API, { method:"POST", headers:{ "content-type":"application/json" }, body:JSON.stringify(op) });
    if(!r.ok) throw new Error("api " + r.status);
    this.setState(await r.json()); this.emit();
  },
  initDemo(){
    this.live = false;
    let d = null; try{ d = JSON.parse(lsGet("cena_demo") || "null"); }catch(e){}
    this.data = d && d.cene ? d : seedDemo();
    this.ready = true; this.persist(); this.emit();
  },
  persist(){ if(!this.live) lsSet("cena_demo", JSON.stringify(this.data)); },
  async saveFamiglia(membri, ora){
    if(this.live) await this.send({ tipo:"famiglia", membri, ora });
    else { this.data.membri = membri; this.data.ora = ora; this.persist(); this.emit(); }
  },
  async saveCena(id, c){
    if(this.live) await this.send(Object.assign({ tipo:"cena", id }, c));
    else { this.data.cene[id] = c; this.persist(); this.emit(); }
  },
  async saveVoto(cena, stelle, commento){
    const id = cena + "_" + DEV, v = { cena, stelle, commento };
    if(this.live) await this.send({ tipo:"voto", cena, dev:DEV, stelle, commento });
    else {
      const row = Object.assign({id}, v), i = this.data.voti.findIndex(x => x.id === id);
      if(i >= 0) this.data.voti[i] = row; else this.data.voti.push(row);
      this.persist(); this.emit();
    }
  },
  resetDemo(){ this.data = seedDemo(); this.persist(); this.emit(); }
};

function seedDemo(){
  Store.data.ora = "20:30";
  const s = slots(), v = fromId(s.vot), w = k => idOf(addDays(v, -7*k));
  const membri = [{id:"m1",nome:"Mamma",emoji:"👩"},{id:"m2",nome:"Papà",emoji:"👨"},{id:"m3",nome:"Edoardo",emoji:"🧑"},{id:"m4",nome:"Nonna",emoji:"👵"}];
  const cene = {}, voti = [];
  const add = (id, chefId, piatto, note, vs) => {
    cene[id] = { chefId, chefNome: membri.find(m => m.id === chefId).nome, piatto, note };
    vs.forEach((x,i) => voti.push({ id:id+"_esempio"+i, cena:id, stelle:x[0], commento:x[1] }));
  };
  add(w(3),"m4","Gnocchi al pomodoro","Fatti a mano, uno per uno",[[5,"Morbidissimi, come sempre"],[5,"La nonna non sbaglia mai"],[4,"Sugo top, ne volevo di più"]]);
  add(w(2),"m2","Pollo arrosto con patate","",[[4,"Patate croccanti perfette"],[3,"Il pollo era un po' asciutto"],[4,"Buono, rifallo!"]]);
  add(w(1),"m1","Lasagne al ragù","La ricetta della domenica",[[5,"Le migliori della zona"],[5,"Doppia porzione obbligatoria"],[4,"Un filo di besciamella in più"]]);
  add(s.vot,"m3","Carbonara","Solo guanciale, niente panna",[[4,"Cremosa al punto giusto"],[5,"Sorpresa della serata"]]);
  cene[s.up] = { chefId:"m1", chefNome:"Mamma", piatto:"Parmigiana di melanzane", note:"Con le melanzane dell'orto" };
  return { membri, ora:"20:30", cene, voti };
}

function member(id){ return (Store.data.membri || []).find(m => m.id === id) || null; }
function chefOf(c){ const m = c && member(c.chefId); return { nome: m ? m.nome : (c && c.chefNome) || "Chef misterioso", emoji: m ? m.emoji : "🍳" }; }
const votesOf = cena => Store.data.voti.filter(v => v.cena === cena && v.stelle >= 1 && v.stelle <= 5);

function suggest(forId){
  const membri = Store.data.membri || []; if(membri.length < 2) return null;
  const last = {};
  Object.keys(Store.data.cene).forEach(id => { const c = Store.data.cene[id]; if(id < forId && c && c.chefId && (!last[c.chefId] || last[c.chefId] < id)) last[c.chefId] = id; });
  let best = null;
  membri.forEach(m => { const l = last[m.id] || ""; if(!best || l < best.l) best = { m, l }; });
  return { nome: best.m.nome, why: best.l ? ": l'ultima volta ha cucinato il " + fmtDM(best.l) + "." : ": non ha ancora mai cucinato." };
}

/* ---------- vista: classifica ---------- */
function chefStats(){
  const s = slots(), map = {};
  Object.keys(Store.data.cene).forEach(id => {
    if(id > s.vot) return;
    const c = Store.data.cene[id]; if(!c || !c.piatto) return;
    const vs = votesOf(id); if(!vs.length) return;
    const key = c.chefId || ("n:" + (c.chefNome || "?")), ch = chefOf(c);
    if(!map[key]) map[key] = { nome:ch.nome, emoji:ch.emoji, sum:0, n:0, cene:0 };
    const e = map[key]; e.sum += vs.reduce((a,v) => a + v.stelle, 0); e.n += vs.length; e.cene++;
  });
  return Object.values(map).map(e => Object.assign(e, { a: e.sum / e.n })).sort((x,y) => (y.a - x.a) || (y.cene - x.cene));
}
function bestDish(){
  const s = slots(); let best = null;
  Object.keys(Store.data.cene).forEach(id => {
    if(id > s.vot) return;
    const c = Store.data.cene[id], vs = votesOf(id);
    if(!c || !c.piatto || !vs.length) return;
    const a = avgOf(vs);
    if(!best || a > best.a || (a === best.a && vs.length > best.n)) best = { id, c, a, n:vs.length };
  });
  return best;
}

  const emo = h("div",{class:"emojis",role:"radiogroup","aria-label":"Avatar"}, EMOJIS.map(x => h("button",{type:"button",class:"emo",role:"radio","aria-checked":String(ui.nm.emoji===x),"aria-label":"Avatar "+x,onclick:() => { ui.nm.emoji = x; render(); }}, x)));
  const nm = h("input",{id:"nm-nome",type:"text",maxlength:"20",autocomplete:"off",placeholder:"Nome (es. Nonna Rita)",oninput:e => { ui.nm.nome = e.target.value; }}); nm.value = ui.nm.nome;
  const ora = h("input",{id:"ora-in",type:"time","aria-label":"Orario della cena",oninput:e => { ui.ora = e.target.value; }}); ora.value = ui.ora || Store.data.ora || "20:30";

    h("div",{class:"card"}, h("h3",{class:"card-title"},"A tavola ci sono"), list,
      h("form",{class:"addm",onsubmit:addMember,novalidate:true}, emo, h("div",{class:"addrow"}, nm, h("button",{class:"btn red",type:"submit"},"Aggiungi")), h("div",{class:"err",role:"alert"}, ui.err.fam || ""))),
    h("form",{class:"card",onsubmit:saveOra}, h("h3",{class:"card-title"},"Orario della cena"), h("div",{class:"addrow"}, ora, h("button",{class:"btn soft",type:"submit"},"Salva"))),
    h("div",{class:"card"}, h("h3",{class:"card-title"},"Promemoria sul telefono"),
      h("p",{class:"hint"},"Ognuno lo aggiunge una volta sola: il telefono avvisa 2 ore prima della cena e poi a fine cena per votare, ogni mercoledì."),

    h("div",{class:"card"}, h("h3",{class:"card-title"},"Invita la famiglia"),

    Store.live ? h("p",{class:"hint center"},"Collegata: i dati sono condivisi con tutta la famiglia.")
      : h("div",{class:"card"}, h("h3",{class:"card-title"},"Modalità prova"), h("p",{class:"hint"},"Stai vedendo una famiglia di esempio salvata solo su questo telefono."),
          h("button",{class:"btn ghost block",type:"button",onclick:() => { Store.resetDemo(); toast("Esempio ripristinato"); }},"Ripristina l'esempio"))

  root.replaceChildren(sheet);

/* ---------- feedback ---------- */
let toastT = 0;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false; t.classList.remove("show"); void t.offsetWidth; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600);
}
function confetti(){
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.getElementById("confetti"), ctx = cv.getContext("2d"); if(!ctx) return;
  const dpr = window.devicePixelRatio || 1, W = cv.width = innerWidth*dpr, H = cv.height = innerHeight*dpr;
  cv.hidden = false;
  const cols = ["#E5412F","#FFB21E","#2E8B57","#5B8DEF","#FF8FA8"];
  const ps = Array.from({length:120}, () => ({ x:W/2, y:H*.6, vx:(Math.random()-.5)*W*.03, vy:-(Math.random()*H*.018 + H*.01), r:(Math.random()*6+5)*dpr, c:cols[Math.random()*5|0], a:Math.random()*6, va:(Math.random()-.5)*.35 }));
  const g = H*.0007, t0 = performance.now();
  (function frame(t){
    ctx.clearRect(0,0,W,H);
    ps.forEach(p => { p.vy += g; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); });
    if(t - t0 < 2400) requestAnimationFrame(frame); else { ctx.clearRect(0,0,W,H); cv.hidden = true; }
  })(t0);
}

/* ---------- render ---------- */
const VIEW_FN = { stasera:viewStasera, chef:viewChef, classifica:viewClassifica, storico:viewStorico };
function saveFocus(){ const a = document.activeElement; return a && a.id && (a.tagName === "INPUT" || a.tagName === "TEXTAREA") ? { id:a.id, s:a.selectionStart, e:a.selectionEnd } : null; }
function restoreFocus(f){ if(!f) return; const el = document.getElementById(f.id); if(el){ el.focus({preventScroll:true}); try{ el.setSelectionRange(f.s, f.e); }catch(e){} } }
function render(){
  const f = saveFocus();
  VIEWS.forEach(v => {
    document.getElementById("v-"+v).hidden = ui.tab !== v;
    const b = document.querySelector('[data-tab="'+v+'"]');
    if(ui.tab === v) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  const box = document.getElementById("v-"+ui.tab);
  if(!Store.ready) box.replaceChildren(h("div",{class:"loader"}, h("div",{class:"mini"}), h("p",null,"Apparecchio la tavola…")));
  else box.replaceChildren.apply(box, VIEW_FN[ui.tab]().filter(Boolean));
  renderSheet();
  restoreFocus(f);
}

document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => go(b.dataset.tab)));
document.getElementById("open-settings").addEventListener("click", openSheet);
document.getElementById("sheet-root").addEventListener("click", e => { if(e.target.id === "sheet-root") closeSheet(); });
document.addEventListener("keydown", e => { if(e.key === "Escape" && ui.sheet) closeSheet(); });
setInterval(() => { const a = document.activeElement; if(!document.hidden && !(a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA"))) render(); }, 60000);
Store.subs.push(render);
render();
Store.init();
})();
